name: CI

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "next.config.*"
      - "tsconfig.json"
      - "postcss.config.*"
      - "eslint.config.*"
      - "prettier.config.*"
      - "vitest.config.*"
      - "react-doctor.config.json"
      - "doctor.config.json"
      - ".github/workflows/**"
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "next.config.*"
      - "tsconfig.json"
      - "postcss.config.*"
      - "eslint.config.*"
      - "prettier.config.*"
      - "vitest.config.*"
      - "react-doctor.config.json"
      - "doctor.config.json"
      - ".github/workflows/**"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true
  NODE_VERSION: "22"
  PNPM_VERSION: "11.1.1"
  NEXT_PUBLIC_SITE_URL: https://web-actualidad-co-politica.vercel.app

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Format check
        run: pnpm format:check

      - name: Test
        run: pnpm test

      - name: React Doctor
        run: pnpm react:doctor
        continue-on-error: true

      - name: Audit dependencies
        run: pnpm audit --prod
        continue-on-error: true

      - name: Build
        run: pnpm build
        env:
          NEXT_PUBLIC_SITE_URL: ${{ env.NEXT_PUBLIC_SITE_URL }}
